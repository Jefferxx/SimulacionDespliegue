# ETalent Dashboard ESPOCH — Nginx Reverse Proxy
# Resuelve alertas ZAP: 10038 (CSP), 10021 (X-Content-Type-Options),
#                        10036 (Server disclosure), 10096 (Timestamps)
#
# Uso en ESPOCH:
#   1. Instalar Nginx en el servidor de despliegue
#   2. Copiar este archivo a /etc/nginx/sites-available/etalent
#   3. ln -s /etc/nginx/sites-available/etalent /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. Streamlit corre en :8501, Nginx expone en :80

server {
    listen 80;
    server_name _;

    # ── ZAP 10036: Suprimir versión del servidor ──────────────────────────────
    server_tokens off;
    add_header Server "ETalent-Dashboard" always;

    # ── ZAP 10038: Content Security Policy ───────────────────────────────────
    # Streamlit/React requiere unsafe-inline y unsafe-eval.
    # wss: y ws: son necesarios para la conexión WebSocket de Streamlit.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.plot.ly; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; frame-ancestors 'self';"
        always;

    # ── ZAP 10021: X-Content-Type-Options ────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;

    # Cabeceras adicionales de buenas prácticas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket — requerido por Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        # ── ZAP 10096: Eliminar timestamps internos de Tornado ───────────────
        proxy_hide_header X-Runtime;
        proxy_hide_header X-Timestamp;
        proxy_hide_header X-Response-Time;
    }
}
