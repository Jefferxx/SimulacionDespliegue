<VirtualHost *:80>
    # Cambiar VM_IP por la IP real de la VM o el Hostname
    # ServerName 192.168.x.x

    # WebSocket — Streamlit lo requiere para actualizaciones en vivo
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /dashboard/(.*) ws://127.0.0.1:8501/dashboard/$1 [P,L]

    # HTTP normal
    ProxyPreserveHost On
    ProxyPass /dashboard http://127.0.0.1:8501/dashboard
    ProxyPassReverse /dashboard http://127.0.0.1:8501/dashboard
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog /var/log/httpd/dashboard_error.log
    CustomLog /var/log/httpd/dashboard_access.log combined
</VirtualHost>
